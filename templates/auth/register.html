{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card border-0 shadow-sm rounded-4 p-5">

                <div class="text-center mb-5">

                    <h2 class="fw-bold">
                        Create an Account
                    </h2>

                    <p class="text-muted mb-0">
                        Choose how you would like to join our platform.
                    </p>

                </div>

                <!-- Donor -->

                <div class="role-box mb-4">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5 class="fw-bold mb-1">
                                ❤️ Donor
                            </h5>

                            <small class="text-muted">
                                Donate surplus food to people in need.
                            </small>

                        </div>

                        <a href="{{ url_for('auth.donor_register') }}"
                           class="btn btn-success">

                            Continue

                        </a>

                    </div>

                </div>

                <!-- NGO -->

                <div class="role-box">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5 class="fw-bold mb-1">
                                🏢 NGO
                            </h5>

                            <small class="text-muted">
                                Register your NGO and receive donations.
                            </small>

                        </div>

                        <a href="{{ url_for('auth.ngo_register') }}"
                           class="btn btn-success">

                            Continue

                        </a>

                    </div>

                </div>

                <hr class="my-4">

                <div class="text-center">

                    Already have an account?

                    <a href="{{ url_for('auth.login') }}"
                       class="text-success fw-semibold text-decoration-none">

                        Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
