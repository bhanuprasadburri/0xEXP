{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card border-0 shadow-sm rounded-4 p-5">

                <div class="text-center mb-5">

                    <h2 class="fw-bold">
                        Welcome Back
                    </h2>

                    <p class="text-muted mb-0">
                        Choose your workspace to sign in.
                    </p>

                </div>

                <!-- Donor Login -->

                <div class="role-box mb-4">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5 class="fw-bold mb-1">
                                <i class="fas fa-hand-holding-heart text-danger me-2"></i>Donor
                            </h5>

                            <small class="text-muted">
                                Sign in to manage your donations.
                            </small>

                        </div>

                        <a href="{{ url_for('auth.donor_login') }}"
                           class="btn btn-success">

                            Sign in

                        </a>

                    </div>

                </div>

                <!-- NGO Login -->

                <div class="role-box">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5 class="fw-bold mb-1">
                                <i class="fas fa-building text-primary me-2"></i>NGO
                            </h5>

                            <small class="text-muted">
                                Access your NGO dashboard.
                            </small>

                        </div>

                        <a href="{{ url_for('auth.ngo_login') }}"
                           class="btn btn-success">

                            Sign in

                        </a>

                    </div>

                </div>

                <hr class="my-4">

                <div class="text-center">
                    <small class="text-muted">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-success fw-bold text-decoration-none">Create one</a>
                    </small>
                </div>

            </div>

        </div>

    </div>

</div>


{% endblock %}
