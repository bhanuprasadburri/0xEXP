{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
            <div class="text-center mb-5">
                <p class="text-success fw-semibold mb-2">Secure access</p>
                <h2 class="fw-bold text-dark">Choose Login Type</h2>
                <p class="text-muted mb-0">Select the account type you want to continue with.</p>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <a href="{{ url_for('auth.donor_login') }}" class="text-decoration-none">
                        <div class="choice-card h-100">
                            <div class="choice-icon">
                                <i class="fas fa-hand-holding-heart"></i>
                            </div>
                            <h3 class="h4 fw-bold text-dark mt-4">Donor</h3>
                            <p class="text-muted mb-4">Login as a food donor.</p>
                            <span class="btn btn-success px-4">Continue</span>
                        </div>
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="{{ url_for('auth.ngo_login') }}" class="text-decoration-none">
                        <div class="choice-card h-100">
                            <div class="choice-icon">
                                <i class="fas fa-building"></i>
                            </div>
                            <h3 class="h4 fw-bold text-dark mt-4">NGO</h3>
                            <p class="text-muted mb-4">Login as an NGO organization.</p>
                            <span class="btn btn-success px-4">Continue</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
