{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="fw-bold mb-3">Choose a new password</h2>
          <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" name="email" id="email" class="form-control" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">New password</label>
              <div class="input-group">
                <input type="password" name="password" id="password" class="form-control" autocomplete="new-password" required>
                <button type="button" class="input-group-text border-0 bg-transparent" onclick="togglePassword('password', 'togglePasswordIcon')" aria-label="Toggle password visibility" style="cursor:pointer;">
                  <i class="fas fa-eye" id="togglePasswordIcon"></i>
                </button>
              </div>
            </div>
            <div class="mb-3">
              <label for="confirm_password" class="form-label">Confirm password</label>
              <div class="input-group">
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" autocomplete="new-password" required>
                <button type="button" class="input-group-text border-0 bg-transparent" onclick="togglePassword('confirm_password', 'toggleConfirmPasswordIcon')" aria-label="Toggle confirm password visibility" style="cursor:pointer;">
                  <i class="fas fa-eye" id="toggleConfirmPasswordIcon"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Update password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
function togglePassword(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);

  if (!input || !icon) {
    return;
  }

  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}
</script>
{% endblock %}
