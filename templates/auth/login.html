{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">
        <h2 class="fw-bold text-success">Welcome Back</h2>
        <p class="text-muted">
            Login as a Donor or NGO
        </p>
    </div>

    <div class="row justify-content-center g-4">

        <!-- Donor Login -->
        <div class="col-lg-5">

            <div class="card shadow border-0 h-100">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <i class="fas fa-hand-holding-heart fa-3x text-success mb-3"></i>

                        <h3 class="fw-bold">
                            Donor Login
                        </h3>

                    </div>

                    <form action="{{ url_for('auth.login') }}" method="POST">

                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="role" value="donor">

                        <div class="mb-3">

                            <label>Email Address</label>

                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   id="donor-email"
                                   placeholder="Enter Email"
                                   autocomplete="email"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label>Password</label>

                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   placeholder="Password"
                                   autocomplete="current-password"
                                   required>

                        </div>

                        <button class="btn btn-success w-100">

                            Login as Donor

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <small>

                            New Donor?

                            <a href="{{ url_for('auth.donor_register') }}"
                               class="text-success text-decoration-none">

                                Register

                            </a>

                        </small>

                    </div>

                </div>

            </div>

        </div>

        <!-- NGO Login -->

        <div class="col-lg-5">

            <div class="card shadow border-0 h-100">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <i class="fas fa-building fa-3x text-success mb-3"></i>

                        <h3 class="fw-bold">

                            NGO Login

                        </h3>

                    </div>

                    <form action="{{ url_for('auth.login') }}" method="POST">

                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="role" value="ngo">

                        <div class="mb-3">

                            <label>Registration Number</label>

                            <input type="text"
                                   class="form-control"
                                   name="registration_number"
                                   placeholder="Registration Number">

                        </div>

                        <div class="mb-3">

                            <label>Official Email</label>

                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   id="ngo-email"
                                   placeholder="Official Email"
                                   autocomplete="email"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label>Password</label>

                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   placeholder="Password"
                                   autocomplete="current-password"
                                   required>

                        </div>

                        <button class="btn btn-success w-100">

                            Login as NGO

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <small>

                            New NGO?

                            <a href="{{ url_for('auth.ngo_register') }}"
                               class="text-success text-decoration-none">

                                Register

                            </a>

                        </small>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
