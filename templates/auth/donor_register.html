
{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-10">

            <div class="card donor-card shadow-lg border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <div class="donor-icon">
                            <i class="fas fa-hand-holding-heart"></i>
                        </div>

                        <h2 class="fw-bold text-success mt-3">
                            Create Donor Account
                        </h2>

                        <p class="text-muted">
                            Help reduce food waste by donating surplus food.
                        </p>

                    </div>

                    <form method="POST" action="{{ url_for('auth.donor_register') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-user"></i>
                                </span>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter your full name">

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>

                                <input
                                    type="email"
                                    name="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email address"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-phone"></i>
                                </span>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    placeholder="+91 XXXXXXXXXX">

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Donor Type
                            </label>

                            <select class="form-select" name="organization_name">

                                <option selected disabled>
                                    Select Donor Type
                                </option>

                                <option>Individual</option>

                                <option>Restaurant</option>

                                <option>Hotel</option>

                                <option>Bakery</option>

                                <option>Catering Service</option>

                                <option>Supermarket</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                name="address"
                                rows="3"
                                placeholder="Enter your address"></textarea>

                        </div>

                        <div class="row">

    <!-- Password -->
    <div class="col-md-6">

        <div class="mb-3">

            <label class="form-label">Password</label>

            <div class="input-group">

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password">

                <span
                    class="input-group-text"
                    onclick="togglePassword()"
                    style="cursor:pointer;">

                    <i class="fas fa-eye" id="toggleIcon"></i>

                </span>

            </div>

        </div>

    </div>

    <!-- Confirm Password -->
    <div class="col-md-6">

    <div class="mb-3">

        <label class="form-label">Confirm Password</label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            class="form-control"
            placeholder="Confirm Password">

    </div>

</div>

</div>

                           

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                required>

                            <label class="form-check-label">

                                I agree to the Terms &
                                Privacy Policy

                            </label>

                        </div>

                        <button
                            class="btn btn-success w-100 btn-lg donor-btn">

                            Create Account

                        </button>

                    </form>
                    <div class="text-center mt-3">

    <small class="text-muted">

        Already have an account?

        <a href="{{ url_for('auth.login_choice') }}" class="text-success text-decoration-none fw-semibold">

            Login

        </a>

    </small>

</div>

                    

                </div>

            </div>

        </div>

    </div>

</div>
<script>

function togglePassword() {

    let password = document.getElementById("password");
    let icon = document.getElementById("toggleIcon");

    if(password.type === "password"){

        password.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    }else{

        password.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }

}

function toggleConfirmPassword() {

    let password = document.getElementById("confirm_password");
    let icon = document.getElementById("toggleConfirmIcon");

    if(password.type === "password"){

        password.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    }else{

        password.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }

}

</script>

{% endblock %}
