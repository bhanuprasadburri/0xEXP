{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-10">

            <div class="card ngo-card shadow-lg border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <div class="ngo-icon">
                            <i class="fas fa-building"></i>
                        </div>

                        <h2 class="fw-bold text-success mt-3">
    Register Your NGO
</h2>

                        <p class="text-muted">
                            Join our platform and help distribute food to people in need.
                        </p>
                        <div class="alert alert-success py-2 mb-4" role="status">
                            Your NGO account will be verified automatically after registration.
                        </div>

                    </div>

                    <form method="POST" action="{{ url_for('auth.ngo_register') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">

                            <label class="form-label">
                                NGO Name
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-building"></i>
                                </span>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter NGO Name">

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Registration Number
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-id-card"></i>
                                </span>

                                <input
                                    type="text"
                                    name="registration_number"
                                    class="form-control"
                                    placeholder="Registration Number">

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Official Email
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>

                                <input
                                    type="email"
                                    name="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email address"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-phone"></i>
                                </span>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    placeholder="+91 XXXXXXXXXX">

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                NGO Address
                            </label>

                            <textarea
                                class="form-control"
                                name="address"
                                rows="3"
                                placeholder="Enter NGO Address"></textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label>Password</label>

                                    <div class="input-group">
                                        <input
                                            type="password"
                                            id="password"
                                            name="password"
                                            class="form-control"
                                            autocomplete="new-password">
                                        <button
                                            type="button"
                                            class="input-group-text border-0 bg-transparent"
                                            onclick="togglePassword('password', 'togglePasswordIcon')"
                                            aria-label="Toggle password visibility"
                                            style="cursor:pointer;">
                                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                                        </button>
                                    </div>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label>Confirm Password</label>

                                    <div class="input-group">
                                        <input
                                            type="password"
                                            id="confirm_password"
                                            name="confirm_password"
                                            class="form-control"
                                            autocomplete="new-password">
                                        <button
                                            type="button"
                                            class="input-group-text border-0 bg-transparent"
                                            onclick="togglePassword('confirm_password', 'toggleConfirmPasswordIcon')"
                                            aria-label="Toggle confirm password visibility"
                                            style="cursor:pointer;">
                                            <i class="fas fa-eye" id="toggleConfirmPasswordIcon"></i>
                                        </button>
                                    </div>

                                </div>

                            </div>

                        </div>

                        <div class="form-check mb-3">

    <input
        class="form-check-input"
        type="checkbox"
        required>

    <label class="form-check-label">
        I certify that the above information is correct.
    </label>

</div>

<div class="text-center mb-3">

    <small style="font-size:14px;" class="text-muted">

        Already have an account?

        <a href="{{ url_for('auth.login_choice') }}" class="text-success fw-semibold text-decoration-none">
            Login
        </a>

    </small>

</div>

<div class="d-grid">

    <button type="submit"
            class="btn btn-success btn-lg ngo-btn">

        Create Account

    </button>

</div>
                        <div class="d-grid mb-4">

    

</div>

</form>

                </div> <!-- End Card Body -->

            </div> <!-- End Card -->

        </div>

    </div>

</div>

{% endblock %}
