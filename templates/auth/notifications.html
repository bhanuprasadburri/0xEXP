{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="fw-bold mb-4">Notifications</h2>
        <ul class="list-group">
            {% for notification in notifications %}
                <li class="list-group-item">{{ notification.message }}</li>
            {% else %}
                <li class="list-group-item">No notifications yet.</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
