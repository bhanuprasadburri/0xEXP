{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="fw-bold mb-4">My Donations</h2>
        <ul class="list-group">
            {% for donation in donations %}
                <li class="list-group-item d-flex justify-content-between">
                    <span>{{ donation.food_name }} - {{ donation.status }}</span>
                    <a href="{{ url_for('donor.donation_details', donation_id=donation.id) }}" class="btn btn-sm btn-outline-primary">Details</a>
                </li>
            {% else %}
                <li class="list-group-item">No donations found.</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
