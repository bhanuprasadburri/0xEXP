{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="fw-bold mb-4">Donation History</h2>
        <ul class="list-group">
            {% for donation in donations %}
                <li class="list-group-item">{{ donation.food_name }} - Completed</li>
            {% else %}
                <li class="list-group-item">No completed donations yet.</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
